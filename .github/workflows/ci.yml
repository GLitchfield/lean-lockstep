name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The example lifecycle test and a few others build tiny Lake projects (each pins its
      # own toolchain, which elan fetches).
      - name: install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: pip install -e ".[test,research,mcp]"
      - run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install build twine
      - run: python3 -m build
      - run: python3 -m twine check --strict dist/*
      - name: the wheel works without a checkout
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/lockstep" --version
          "$RUNNER_TEMP/venv/bin/python" -c 'import lockstep; assert (lockstep.DATA / "Extract.lean.tmpl").is_file()'
          rc=0; echo '{"tool_input":{"command":"nohup true"}}' | "$RUNNER_TEMP/venv/bin/lockstep" hook pre-bash || rc=$?
          test "$rc" -eq 2
